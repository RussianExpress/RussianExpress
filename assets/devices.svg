<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" fill="none">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1000" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04120A"/>
      <stop offset="1" stop-color="#020503"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,monospace; }
      .lbl { fill: #4C7A5A; font-size: 11px; letter-spacing: 1.2px; }
      .val { fill: #D8FFDD; font-size: 14px; }
      .h { fill: #39FF14; font-size: 12px; letter-spacing: 1.6px; }
      .acc { fill: #B6FF3B; font-size: 11px; letter-spacing: 1.4px; }
    </style>
  </defs>

  <text x="24" y="34" class="mono h">// TEST DEVICE</text>
  <rect x="24" y="46" width="952" height="1" fill="#123B21"/>

  <rect x="24" y="64" width="952" height="112" rx="14" fill="url(#card)" stroke="#123B21"/>

  <!-- phone icon -->
  <g transform="translate(46 84)">
    <rect width="40" height="72" rx="8" fill="#020503" stroke="#39FF14" stroke-opacity="0.6"/>
    <rect x="13" y="6" width="14" height="3" rx="1.5" fill="#4C7A5A"/>
    <rect x="10" y="16" width="20" height="38" rx="2" fill="#0B2E18" stroke="#123B21"/>
    <rect x="13" y="22" width="14" height="2" fill="#39FF14" opacity="0.5"/>
    <rect x="13" y="30" width="10" height="2" fill="#39FF14" opacity="0.35"/>
    <rect x="13" y="38" width="12" height="2" fill="#39FF14" opacity="0.25"/>
    <circle cx="20" cy="64" r="2.5" fill="#4C7A5A"/>
  </g>

  <g class="mono">
    <text x="112" y="92" class="lbl">MODEL</text>
    <text x="112" y="112" class="val">OnePlus 15 (CPH2749)</text>

    <text x="420" y="92" class="lbl">MEMORY / STORAGE</text>
    <text x="420" y="112" class="val">16 / 512 GB</text>

    <text x="660" y="92" class="lbl">OS / ABI</text>
    <text x="660" y="112" class="val">Android 16 · arm64-v8a</text>

    <text x="112" y="148" class="lbl">ROLE</text>
    <text x="170" y="148" class="acc">MTA mobile test rig</text>

    <text x="420" y="148" class="lbl">ENGINE</text>
    <text x="486" y="148" class="val" font-size="12">libGame.so 2.11.311 · 22 357 exports</text>
  </g>
</svg>
