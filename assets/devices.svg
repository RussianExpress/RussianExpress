<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="216" viewBox="0 0 1000 216" fill="none">
  <rect width="100%" height="100%" fill="#020503"/>
<defs>
    <linearGradient id="card" x1="0" y1="0" x2="1000" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04120A"/>
      <stop offset="1" stop-color="#020503"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; }
      .lbl { fill: #4C7A5A; font-size: 10px; letter-spacing: 1.3px; }
      .val { fill: #D8FFDD; font-size: 14px; }
      .h { fill: #39FF14; font-size: 12px; letter-spacing: 1.6px; }
      .acc { fill: #B6FF3B; font-size: 11px; letter-spacing: 1.2px; }
      .sep { fill: #123B21; }
    </style>
  </defs>

  <text x="24" y="34" class="mono h">// TEST DEVICE</text>
  <rect x="24" y="46" width="952" height="1" fill="#123B21"/>

  <rect x="24" y="64" width="952" height="136" rx="14" fill="url(#card)" stroke="#123B21"/>
  <rect x="24" y="64" width="4" height="136" rx="2" fill="#39FF14" opacity="0.85"/>

  <!-- phone icon -->
  <g transform="translate(48 86)">
    <rect width="42" height="76" rx="9" fill="#020503" stroke="#39FF14" stroke-opacity="0.65"/>
    <rect x="14" y="7" width="14" height="3" rx="1.5" fill="#4C7A5A"/>
    <rect x="10" y="18" width="22" height="40" rx="2" fill="#0B2E18" stroke="#123B21"/>
    <rect x="14" y="25" width="14" height="2" fill="#39FF14" opacity="0.55"/>
    <rect x="14" y="33" width="10" height="2" fill="#39FF14" opacity="0.38"/>
    <rect x="14" y="41" width="12" height="2" fill="#39FF14" opacity="0.25"/>
    <circle cx="21" cy="67" r="2.5" fill="#4C7A5A"/>
  </g>

  <g class="mono">
    <!-- row 1 -->
    <text x="118" y="94" class="lbl">MODEL</text>
    <text x="118" y="114" class="val">OnePlus 15 (CPH2749)</text>

    <text x="410" y="94" class="lbl">MEMORY / STORAGE</text>
    <text x="410" y="114" class="val">16 / 512 GB</text>

    <text x="640" y="94" class="lbl">OS / ABI</text>
    <text x="640" y="114" class="val">Android 16 · arm64-v8a</text>

    <rect x="118" y="132" width="834" height="1" class="sep"/>

    <!-- row 2 -->
    <text x="118" y="158" class="lbl">ROLE</text>
    <text x="164" y="158" class="acc">MTA mobile test rig</text>

    <text x="470" y="158" class="lbl">ENGINE</text>
    <text x="530" y="158" class="val" font-size="12">libGame.so 2.11.311 · 22 357 exports</text>
</g>
</svg>
