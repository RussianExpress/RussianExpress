<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,monospace; }
      .h { fill: #39FF14; font-size: 12px; letter-spacing: 1.6px; }
      .t { fill: #D8FFDD; font-size: 13px; }
      .m { fill: #4C7A5A; font-size: 11px; letter-spacing: 1.2px; }
      .s { fill: #6E9B7A; font-size: 11px; }
    </style>
  </defs>

  <text x="24" y="34" class="mono h">// ROADMAP</text>
  <rect x="24" y="46" width="952" height="1" fill="#123B21"/>

  <!-- track -->
  <rect x="70" y="132" width="860" height="2" fill="#123B21"/>
  <rect x="70" y="132" width="640" height="2" fill="#39FF14" opacity="0.55"/>

  <!-- node 1 done -->
  <g>
    <circle cx="70" cy="133" r="9" fill="#39FF14"/>
    <circle cx="70" cy="133" r="15" fill="#39FF14" opacity="0.12"/>
    <text x="70" y="110" class="mono s" text-anchor="middle">M1 — M6</text>
    <text x="70" y="175" class="mono t" text-anchor="middle">engine bridge</text>
    <text x="70" y="195" class="mono m" text-anchor="middle">proxy · crypto · identity</text>
  </g>

  <!-- node 2 done -->
  <g>
    <circle cx="285" cy="133" r="9" fill="#39FF14"/>
    <text x="285" y="110" class="mono s" text-anchor="middle">M7</text>
    <text x="285" y="175" class="mono t" text-anchor="middle">HUD · CEGUI · Lua</text>
    <text x="285" y="195" class="mono m" text-anchor="middle">on-device working</text>
  </g>

  <!-- node 3 done -->
  <g>
    <circle cx="500" cy="133" r="9" fill="#39FF14"/>
    <text x="500" y="110" class="mono s" text-anchor="middle">M8</text>
    <text x="500" y="175" class="mono t" text-anchor="middle">game_android</text>
    <text x="500" y="195" class="mono m" text-anchor="middle">CGame · CPed · CWorld</text>
  </g>

  <!-- node 4 partial -->
  <g>
    <circle cx="710" cy="133" r="9" fill="#020503" stroke="#39FF14" stroke-width="2"/>
    <path d="M710 124 A9 9 0 0 1 710 142 Z" fill="#39FF14"/>
    <text x="710" y="110" class="mono s" text-anchor="middle">M9</text>
    <text x="710" y="175" class="mono t" text-anchor="middle">client logic</text>
    <text x="710" y="195" class="mono m" text-anchor="middle">7 / 225 files</text>
  </g>

  <!-- node 5 next -->
  <g>
    <circle cx="925" cy="133" r="9" fill="#020503" stroke="#4C7A5A" stroke-width="2"/>
    <text x="925" y="110" class="mono s" text-anchor="middle">NEXT</text>
    <text x="925" y="175" class="mono t" text-anchor="middle">full logic + sync</text>
    <text x="925" y="195" class="mono m" text-anchor="middle">pending</text>
  </g>

  <!-- legend -->
  <g class="mono s" font-size="11">
    <circle cx="30" cy="236" r="4" fill="#39FF14"/>
    <text x="42" y="240">done</text>
    <circle cx="106" cy="236" r="4" fill="#020503" stroke="#39FF14" stroke-width="2"/>
    <text x="118" y="240">in progress</text>
    <circle cx="224" cy="236" r="4" fill="#020503" stroke="#4C7A5A" stroke-width="2"/>
    <text x="236" y="240">next</text>
  </g>
</svg>
