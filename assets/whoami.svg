<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none">
  <rect width="100%" height="100%" fill="#020503"/>
<defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04120A"/>
      <stop offset="1" stop-color="#020503"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; }
      .k { fill: #39FF14; font-weight: 600; }
      .s { fill: #D8FFDD; }
      .m { fill: #4C7A5A; }
      .a { fill: #B6FF3B; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="330" rx="16" fill="url(#panel)" stroke="#123B21"/>
  <rect x="0" y="0" width="1000" height="3" fill="url(#top)"/>

  <!-- window chrome -->
  <rect x="0" y="3" width="1000" height="34" rx="16" fill="#04120A"/>
  <rect x="0" y="30" width="1000" height="7" fill="#04120A"/>
  <circle cx="24" cy="21" r="5" fill="#39FF14"/>
  <circle cx="42" cy="21" r="5" fill="#00E676"/>
  <circle cx="60" cy="21" r="5" fill="#B6FF3B"/>
  <text x="84" y="26" class="mono" font-size="12" fill="#4C7A5A">bash — whoami — 96x24</text>
  <rect x="0" y="37" width="1000" height="1" fill="#123B21"/>

  <g class="mono" font-size="15">
    <text x="30" y="72" class="k">$ whoami</text>
    <text x="30" y="98" class="s">russianexpress — reverse engineer &amp; mobile native developer</text>

    <text x="30" y="136" class="k">$ cat /etc/skills</text>
    <text x="30" y="162" class="s">C++  ·  C  ·  JavaScript  ·  Assembly (ARM64 / Thumb-2)</text>
    <text x="30" y="184" class="s">Reverse Engineering  ·  IDA / Ghidra  ·  ABI archaeology</text>
    <text x="30" y="206" class="s">Android NDK  ·  JNI  ·  CMake  ·  Lua  ·  CEGUI</text>

    <text x="30" y="244" class="k">$ uname -a</text>
    <text x="30" y="270" class="s">Android 16  ·  arm64-v8a  ·  GTA:SA 2.11.311  ·  MTA:SA</text>

    <text x="30" y="304" class="m"># current target:</text>
    <text x="192" y="304" class="a">MTA:SA Mobile</text>
    <rect x="332" y="290" width="10" height="17" fill="#39FF14">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(742 56)">
    <rect width="224" height="250" rx="12" fill="#020503" stroke="#123B21"/>
    <text x="20" y="30" class="mono" font-size="11" letter-spacing="1.4" fill="#4C7A5A">SYSTEM</text>
    <rect x="20" y="40" width="184" height="1" fill="#123B21"/>

    <text x="20" y="66" class="mono" font-size="11" fill="#4C7A5A">STATUS</text>
    <circle cx="24" cy="82" r="4" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="87" class="mono" font-size="12" fill="#D8FFDD">on device</text>

    <text x="20" y="118" class="mono" font-size="11" fill="#4C7A5A">PHONE</text>
    <text x="20" y="139" class="mono" font-size="12" fill="#D8FFDD">OnePlus 15</text>

    <text x="20" y="170" class="mono" font-size="11" fill="#4C7A5A">MEMORY</text>
    <text x="20" y="191" class="mono" font-size="12" fill="#D8FFDD">16 / 512 GB</text>

    <text x="20" y="222" class="mono" font-size="11" fill="#4C7A5A">ENGINE</text>
    <text x="20" y="243" class="mono" font-size="12" fill="#D8FFDD">libGame.so</text>
  </g>
</svg>
