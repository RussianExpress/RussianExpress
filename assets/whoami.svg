<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04120A"/>
      <stop offset="1" stop-color="#020503"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,monospace; }
      .k { fill: #39FF14; font-weight: 600; }
      .s { fill: #D8FFDD; }
      .m { fill: #4C7A5A; }
      .a { fill: #B6FF3B; }
      .lbl { fill: #4C7A5A; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="330" rx="16" fill="url(#panel)" stroke="#123B21"/>
  <rect x="0" y="0" width="1000" height="3" fill="url(#top)"/>

  <g class="mono" font-size="15">
    <text x="30" y="42" class="k">$ whoami</text>
    <text x="30" y="70" class="s">russianexpress — reverse engineer &amp; mobile native developer</text>

    <text x="30" y="110" class="k">$ cat /etc/skills</text>
    <text x="30" y="136" class="s">C++  ·  C  ·  JavaScript  ·  Assembly (ARM64 / Thumb-2)</text>
    <text x="30" y="158" class="s">Reverse Engineering  ·  IDA / Ghidra  ·  ABI archaeology</text>
    <text x="30" y="180" class="s">Android NDK  ·  JNI  ·  CMake  ·  Lua  ·  CEGUI</text>

    <text x="30" y="220" class="k">$ uname -a</text>
    <text x="30" y="246" class="s">Android 16  ·  arm64-v8a  ·  GTA:SA 2.11.311  ·  MTA:SA</text>

    <text x="30" y="286" class="m"># current target:</text>
    <text x="192" y="286" class="a">MTA:SA Mobile — порт клиента MTA:SA на Android</text>
    <rect x="700" y="274" width="10" height="17" fill="#39FF14">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(760 40)">
    <rect width="206" height="250" rx="12" fill="#020503" stroke="#123B21"/>
    <text x="20" y="30" class="mono" font-size="12" letter-spacing="1.2" fill="#4C7A5A">SYSTEM</text>
    <rect x="20" y="40" width="166" height="1" fill="#123B21"/>

    <text x="20" y="66" class="mono" font-size="11" fill="#4C7A5A">STATUS</text>
    <circle cx="24" cy="82" r="4" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="87" class="mono" font-size="12" fill="#D8FFDD">on device</text>

    <text x="20" y="118" class="mono" font-size="11" fill="#4C7A5A">PHONE</text>
    <text x="20" y="139" class="mono" font-size="12" fill="#D8FFDD">OnePlus 15</text>

    <text x="20" y="170" class="mono" font-size="11" fill="#4C7A5A">MEMORY</text>
    <text x="20" y="191" class="mono" font-size="12" fill="#D8FFDD">16 / 512 GB</text>

    <text x="20" y="222" class="mono" font-size="11" fill="#4C7A5A">ENGINE</text>
    <text x="20" y="243" class="mono" font-size="12" fill="#D8FFDD">libGame.so</text>
  </g>
</svg>
