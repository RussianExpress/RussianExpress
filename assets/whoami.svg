<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040B07"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#00C853" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,monospace; }
      .k { fill: #39FF14; font-weight: 600; }
      .s { fill: #D8FFDD; }
      .m { fill: #4C7A5A; }
      .a { fill: #B6FF3B; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="16" fill="url(#panel)" stroke="#0F3A20"/>
  <rect x="0" y="0" width="1000" height="3" fill="url(#top)"/>

  <g class="mono" font-size="15">
    <text x="28" y="42" class="k">$ whoami</text>
    <text x="28" y="70" class="s">russianexpress — reverse engineer &amp; mobile native developer</text>

    <text x="28" y="110" class="k">$ cat /etc/skills</text>
    <text x="28" y="136" class="s">C++  ·  C  ·  JavaScript  ·  Assembly (ARM64 / Thumb-2)</text>
    <text x="28" y="158" class="s">Reverse Engineering  ·  IDA / Ghidra  ·  ABI archaeology</text>
    <text x="28" y="180" class="s">Android NDK  ·  JNI  ·  CMake  ·  Lua  ·  CEGUI</text>

    <text x="28" y="220" class="k">$ uname -a</text>
    <text x="28" y="246" class="s">Android 16  ·  arm64-v8a  ·  GTA:SA 2.11.311  ·  MTA:SA</text>

    <text x="28" y="278" class="m"># current target:</text>
    <text x="190" y="278" class="a">MTA:SA Mobile — порт не-сетевой части клиента MTA на Android</text>
  </g>

  <g transform="translate(790 30)">
    <rect width="180" height="240" rx="12" fill="#020504" stroke="#0F3A20"/>
    <text x="20" y="32" class="mono" font-size="13" fill="#4C7A5A">status</text>
    <circle cx="26" cy="60" r="5" fill="#39FF14"/>
    <text x="42" y="65" class="mono" font-size="13" fill="#D8FFDD">on device</text>
    <text x="20" y="100" class="mono" font-size="13" fill="#4C7A5A">device</text>
    <text x="20" y="122" class="mono" font-size="13" fill="#D8FFDD">CPH2749</text>
    <text x="20" y="156" class="mono" font-size="13" fill="#4C7A5A">engine</text>
    <text x="20" y="178" class="mono" font-size="13" fill="#D8FFDD">libGame.so</text>
    <text x="20" y="212" class="mono" font-size="13" fill="#4C7A5A">tools</text>
    <text x="20" y="234" class="mono" font-size="13" fill="#D8FFDD">IDA · Frida</text>
  </g>
</svg>
