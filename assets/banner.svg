<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-label="RussianExpress — reverse engineer, C++ / C / JavaScript / Assembly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020503"/>
      <stop offset="0.5" stop-color="#030A06"/>
      <stop offset="1" stop-color="#04120A"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="0.6" stop-color="#B6FF3B"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 30) rotate(40) scale(360)">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 350) rotate(-45) scale(380)">
      <stop offset="0" stop-color="#00E676" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#0E2B19" stroke-opacity="0.85" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#39FF14" fill-opacity="0.85"/>
      <rect x="14" width="14" height="28" fill="#020503"/>
    </pattern>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020503" stop-opacity="0"/>
      <stop offset="1" stop-color="#020503" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glowA)"/>
  <rect width="1280" height="360" fill="url(#glowB)"/>

  <!-- animated scanline -->
  <rect x="0" y="0" width="1280" height="2" fill="#39FF14" opacity="0.35">
    <animate attributeName="y" values="-4;364" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1280" height="3" fill="url(#acid)"/>

  <!-- label chip -->
  <g>
    <rect x="64" y="58" width="188" height="26" rx="13" fill="#031008" stroke="#123B21"/>
    <circle cx="82" cy="71" r="4" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="76" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="12" letter-spacing="1.4" fill="#7FCF9A">WHOAMI / PROFILE</text>
  </g>

  <text x="64" y="176" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="72" font-weight="700" fill="#E8FFE9">RussianExpress</text>
  <text x="66" y="214" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="20" fill="url(#acid)">reverse engineer · c++ / c / javascript / assembly</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="13" fill="#BFFFD0">
    <rect x="64" y="246" width="86" height="30" rx="8" fill="#04120A" stroke="#123B21"/>
    <text x="86" y="266">C++</text>
    <rect x="158" y="246" width="70" height="30" rx="8" fill="#04120A" stroke="#123B21"/>
    <text x="182" y="266">C</text>
    <rect x="236" y="246" width="118" height="30" rx="8" fill="#04120A" stroke="#123B21"/>
    <text x="252" y="266">JavaScript</text>
    <rect x="362" y="246" width="104" height="30" rx="8" fill="#04120A" stroke="#123B21"/>
    <text x="378" y="266">ASM</text>
    <rect x="474" y="246" width="196" height="30" rx="8" fill="#031008" stroke="#39FF14" stroke-opacity="0.6"/>
    <text x="492" y="266" fill="#39FF14">reverse engineering</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(700 62)">
    <rect width="516" height="238" rx="14" fill="#030A06" stroke="#123B21"/>
    <rect width="516" height="34" rx="14" fill="#04120A"/>
    <rect y="24" width="516" height="10" fill="#04120A"/>
    <circle cx="22" cy="17" r="5" fill="#39FF14"/>
    <circle cx="40" cy="17" r="5" fill="#00E676"/>
    <circle cx="58" cy="17" r="5" fill="#B6FF3B"/>
    <text x="82" y="22" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="12" fill="#4C7A5A">mta-mobile — private/android-port</text>

    <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="13">
      <text x="24" y="66" fill="#39FF14">$ git log --oneline -5</text>
      <text x="24" y="92" fill="#A8DDB5">6ddb01a docs: OnePlus 15 (CPH2749)</text>
      <text x="24" y="114" fill="#A8DDB5">dfcf970 README: profile + telegram</text>
      <text x="24" y="136" fill="#A8DDB5">c8cde98 client logic: audio stubs</text>
      <text x="24" y="158" fill="#A8DDB5">0f98485 CServerInfo in libMTA</text>
      <text x="24" y="180" fill="#6E9B7A"># GTA:SA 2.11.311 · arm64-v8a · NDK r29</text>
      <text x="24" y="212" fill="#39FF14">$ <tspan fill="#E8FFE9">./next.sh</tspan></text>
      <rect x="100" y="200" width="9" height="16" fill="#39FF14">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- hazard strip -->
  <rect x="0" y="334" width="1280" height="10" fill="url(#hazard)" opacity="0.55"/>
  <rect x="0" y="344" width="1280" height="16" fill="url(#fadeDown)"/>
</svg>
