<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020504"/>
      <stop offset="0.55" stop-color="#030806"/>
      <stop offset="1" stop-color="#04100A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#B6FF3B"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="1" stop-color="#00C853"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) rotate(45) scale(300)">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
