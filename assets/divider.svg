<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" fill="none">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#39FF14" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#B6FF3B" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#39FF14" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hz" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#39FF14"/>
      <rect x="10" width="10" height="20" fill="#030A06"/>
    </pattern>
    <clipPath id="hzclip"><rect x="0" y="4" width="1000" height="6" rx="3"/></clipPath>
  </defs>
  <rect x="0" y="5" width="1000" height="4" fill="url(#l)"/>
  <rect x="0" y="4" width="1000" height="6" fill="url(#hz)" opacity="0.22" clip-path="url(#hzclip)">
    <animate attributeName="x" values="0;20" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="500" cy="7" r="3" fill="#B6FF3B">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
